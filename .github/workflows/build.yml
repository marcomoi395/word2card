name: Build and Release

on:
    pull_request:
        types:
            - closed
        branches:
            - main
    push:
        tags:
            - 'v*'
permissions:
    contents: read

jobs:
    release-quality:
        name: Release quality gate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main') || startsWith(github.ref, 'refs/tags/v')
        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run quality checks
              run: |
                  bun run lint
                  bun run typecheck
                  bun run test
                  bun run build
                  bun audit --severity high

            - name: Validate release version
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  bun <<'BUN'
                  import { readFileSync } from 'node:fs';
                  const tag = process.env.RELEASE_TAG;
                  const semver = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
                  if (!semver.test(tag)) throw new Error(`Invalid release tag: ${tag}`);
                  const expected = tag.slice(1);
                  const actual = JSON.parse(readFileSync('package.json', 'utf8')).version;
                  if (actual !== expected) throw new Error(`Tag ${tag} does not match package.json version ${actual}`);
                  BUN

    build-linux:
        name: Build Linux assets
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: release-quality
        if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main') || startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
              with:
                  persist-credentials: false
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build application
              run: bun run build
            - name: Build Linux packages
              run: bun x electron-builder --linux AppImage deb --publish never
            - name: Validate Linux artifacts
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  test -f "dist/word2card-${VERSION}.AppImage"
                  test -f "dist/word2card_${VERSION}_amd64.deb"
            - name: Packaged Linux smoke test
              run: |
                  chmod +x dist/*.AppImage
                  xvfb-run -a timeout 20s dist/*.AppImage --appimage-extract-and-run --no-sandbox >/tmp/word2card.log 2>&1 &
                  pid=$!
                  sleep 8
                  if ! kill -0 "$pid" 2>/dev/null; then
                    if wait "$pid"; then status=0; else status=$?; fi
                    cat /tmp/word2card.log
                    echo "Packaged application exited before smoke-test window: $status"
                    exit 1
                  fi
                  kill "$pid" 2>/dev/null || true
                  wait "$pid" || true
            - name: Generate Linux checksums
              working-directory: dist
              run: sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
              with:
                  name: linux-packages
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/SHA256SUMS-linux.txt
                  if-no-files-found: error
                  retention-days: 1
            - name: Attest Linux artifacts
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: |
                      dist/*.AppImage
                      dist/*.deb

    build-windows:
        name: Build Windows assets
        runs-on: windows-latest
        timeout-minutes: 30
        needs: release-quality
        if: (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'main') || startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - name: Checkout code
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
              with:
                  persist-credentials: false
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build application
              run: bun run build
            - name: Build Windows installer
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
              run: bun x electron-builder --windows nsis --publish never
            - name: Validate Windows artifacts
              shell: bash
              run: |
                  VERSION=$(bun -e "console.log(require('./package.json').version)")
                  test -f "dist/word2card-${VERSION}-setup.exe"
            - name: Generate Windows checksums
              shell: bash
              working-directory: dist
              run: sha256sum *.exe *.blockmap > SHA256SUMS-windows.txt
            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
              with:
                  name: windows-installer
                  path: |
                      dist/*.exe
                      dist/*.blockmap
                      dist/SHA256SUMS-windows.txt
                  if-no-files-found: error
                  retention-days: 1
            - name: Attest Windows artifacts
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: |
                      dist/*.exe
                      dist/*.blockmap

    create-release:
        name: Create GitHub release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [release-quality, build-linux, build-windows]
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - name: Download Linux artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: linux-packages
                  path: dist
            - name: Download Windows artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: windows-installer
                  path: dist
            - name: Validate release artifacts
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  VERSION="${RELEASE_TAG#v}"
                  test -f "dist/word2card-${VERSION}.AppImage"
                  test -f "dist/word2card_${VERSION}_amd64.deb"
                  test -f "dist/word2card-${VERSION}-setup.exe"
                  test -f dist/SHA256SUMS-linux.txt
                  test -f dist/SHA256SUMS-windows.txt
                  (cd dist && sha256sum -c SHA256SUMS-linux.txt && sha256sum -c SHA256SUMS-windows.txt)
            - name: Generate release body
              shell: bash
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  cat > /tmp/release-body.md <<EOF
                  ## Word2Card ${RELEASE_TAG}

                  ### Installation

                  **Linux:**
                  - **AppImage**: Download \`word2card-${RELEASE_TAG#v}.AppImage\`
                  - **Debian/Ubuntu**: Download \`word2card_${RELEASE_TAG#v}_amd64.deb\`

                  **Windows:**
                  - Download \`word2card-${RELEASE_TAG#v}-setup.exe\`

                  ### Integrity
                  See \`SHA256SUMS-linux.txt\` and \`SHA256SUMS-windows.txt\`.

                  See the [full changelog](https://github.com/${REPOSITORY}/compare/${RELEASE_TAG}^...${RELEASE_TAG}).
                  **Note:** This is a draft release. Review the assets and publish when ready.
                  EOF
            - name: Create draft release and upload assets
              uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
              with:
                  tag_name: ${{ github.ref_name }}
                  draft: true
                  prerelease: ${{ contains(github.ref, 'RC') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
                  body_path: /tmp/release-body.md
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
