name: Release

on:
    pull_request:
        types:
            - closed
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: release-${{ github.event.pull_request.merge_commit_sha || github.run_id }}
    cancel-in-progress: false

jobs:
    release_quality:
        name: Release quality gate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
        outputs:
            release_tag: ${{ steps.release_version.outputs.tag }}
        steps:
            - name: Checkout merge commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run quality checks
              run: |
                  bun x prettier --check .
                  bun run lint
                  bun run typecheck
                  bun run test
                  bun audit --severity high
            - name: Validate release version
              id: release_version
              env:
                  RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
              run: |
                  bun <<'BUN'
                  import { readFileSync } from 'node:fs';

                  const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
                  const branch = process.env.RELEASE_BRANCH!;
                  const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

                  if (!semver.test(version)) throw new Error(`Invalid package.json version: ${version}`);
                  if (branch !== `release/v${version}`) throw new Error(`Branch ${branch} does not match package.json version ${version}`);
                  console.log(`Release version: ${version}`);
                  await Bun.write(process.env.GITHUB_OUTPUT!, `version=${version}\ntag=v${version}\n`);
                  BUN

    build_linux:
        name: Build Linux assets
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: release_quality
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - name: Checkout merge commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
                  persist-credentials: false
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build application
              run: bun run build
            - name: Build Linux packages
              run: bun x electron-builder --linux AppImage deb --publish never
            - name: Validate Linux artifacts
              shell: bash
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  test -f "dist/word2card-${VERSION}.AppImage"
                  test -f "dist/word2card_${VERSION}_amd64.deb"
            - name: Packaged Linux smoke test
              run: |
                  chmod +x dist/*.AppImage
                  xvfb-run -a timeout 20s dist/*.AppImage --appimage-extract-and-run --no-sandbox >/tmp/word2card.log 2>&1 &
                  pid=$!
                  sleep 8
                  if ! kill -0 "$pid" 2>/dev/null; then
                    if wait "$pid"; then status=0; else status=$?; fi
                    cat /tmp/word2card.log
                    echo "Packaged application exited before smoke-test window: $status"
                    exit 1
                  fi
                  kill "$pid" 2>/dev/null || true
                  wait "$pid" || true
            - name: Generate Linux checksums
              working-directory: dist
              run: sha256sum *.AppImage *.deb > SHA256SUMS-linux.txt
            - name: Upload Linux artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
              with:
                  name: linux-packages
                  path: |
                      dist/*.AppImage
                      dist/*.deb
                      dist/SHA256SUMS-linux.txt
                  if-no-files-found: error
                  retention-days: 7
            - name: Attest Linux artifacts
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: |
                      dist/*.AppImage
                      dist/*.deb

    build_windows:
        name: Build Windows assets
        runs-on: windows-latest
        timeout-minutes: 30
        needs: release_quality
        permissions:
            contents: read
            id-token: write
            attestations: write
        steps:
            - name: Checkout merge commit
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
                  persist-credentials: false
            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Build application
              run: bun run build
            - name: Build Windows installer
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
              run: bun x electron-builder --windows nsis --publish never
            - name: Validate Windows artifacts
              shell: bash
              run: |
                  VERSION=$(bun -e "console.log(require('./package.json').version)")
                  test -f "dist/word2card-${VERSION}-setup.exe"
            - name: Generate Windows checksums
              shell: bash
              working-directory: dist
              run: sha256sum *.exe *.blockmap > SHA256SUMS-windows.txt
            - name: Upload Windows artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
              with:
                  name: windows-installer
                  path: |
                      dist/*.exe
                      dist/*.blockmap
                      dist/SHA256SUMS-windows.txt
                  if-no-files-found: error
                  retention-days: 7
            - name: Attest Windows artifacts
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: |
                      dist/*.exe
                      dist/*.blockmap

    create-release:
        name: Create GitHub release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [release_quality, build_linux, build_windows]
        if: needs.release_quality.result == 'success'
        permissions:
            contents: write
        steps:
            - name: Download Linux artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: linux-packages
                  path: dist
            - name: Download Windows artifacts
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: windows-installer
                  path: dist
            - name: Validate release artifacts
              shell: bash
              env:
                  RELEASE_TAG: ${{ needs.release_quality.outputs.release_tag }}
              run: |
                  echo "Release tag: ${RELEASE_TAG:-<empty>}"
                  VERSION="${RELEASE_TAG#v}"
                  echo "Expected version: ${VERSION:-<empty>}"
                  echo "Downloaded files:"
                  find dist -maxdepth 2 -type f -printf '%p\n' | sort

                  for artifact in \
                    "dist/word2card-${VERSION}.AppImage" \
                    "dist/word2card_${VERSION}_amd64.deb" \
                    "dist/word2card-${VERSION}-setup.exe" \
                    dist/SHA256SUMS-linux.txt \
                    dist/SHA256SUMS-windows.txt; do
                    if [[ ! -f "$artifact" ]]; then
                      echo "::error title=Missing release artifact::$artifact"
                      exit 1
                    fi
                  done

                  (cd dist && sha256sum -c SHA256SUMS-linux.txt && sha256sum -c SHA256SUMS-windows.txt)
            - name: Generate release body
              shell: bash
              env:
                  RELEASE_TAG: ${{ needs.release_quality.outputs.release_tag }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  cat > /tmp/release-body.md <<EOF
                  ## Word2Card ${RELEASE_TAG}

                  ### Installation

                  **Linux:**
                  - **AppImage**: Download \`word2card-${RELEASE_TAG#v}.AppImage\`
                  - **Debian/Ubuntu**: Download \`word2card_${RELEASE_TAG#v}_amd64.deb\`

                  **Windows:**
                  - Download \`word2card-${RELEASE_TAG#v}-setup.exe\`

                  ### Integrity
                  See \`SHA256SUMS-linux.txt\` and \`SHA256SUMS-windows.txt\`.

                  See the [full changelog](https://github.com/${REPOSITORY}/compare/${RELEASE_TAG}^...${RELEASE_TAG}).
                  **Note:** This is a draft release. Review the assets and publish when ready.
                  EOF
            - name: Create draft release and upload assets
              uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: ${{ needs.release_quality.outputs.release_tag }}
                  target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
                  draft: true
                  prerelease: ${{ contains(needs.release_quality.outputs.release_tag, 'RC') || contains(needs.release_quality.outputs.release_tag, 'beta') || contains(needs.release_quality.outputs.release_tag, 'alpha') }}
                  body_path: /tmp/release-body.md
                  files: dist/*
