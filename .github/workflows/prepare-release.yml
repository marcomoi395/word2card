name: Prepare Release

on:
    workflow_dispatch:
        inputs:
            increment:
                description: Version increment
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: write
    pull-requests: write

jobs:
    prepare:
        name: Create release PR
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check source branch
              if: github.ref_name != 'main'
              run: |
                  echo "Prepare Release must be run from main, not ${GITHUB_REF_NAME}."
                  exit 1

            - name: Checkout main
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
              with:
                  ref: main
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - name: Calculate release version
              id: version
              env:
                  INCREMENT: ${{ inputs.increment }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Only stable x.y.z versions are supported: $VERSION"
                    exit 1
                  fi

                  IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
                  case "$INCREMENT" in
                    patch) PATCH=$((PATCH + 1)) ;;
                    minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                    major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                    *) echo "Unsupported increment: $INCREMENT"; exit 1 ;;
                  esac

                  RELEASE_VERSION="$MAJOR.$MINOR.$PATCH"
                  RELEASE_BRANCH="release/v$RELEASE_VERSION"

                  if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
                    echo "Release branch already exists; it will be reused: $RELEASE_BRANCH"
                    echo "branch_exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "branch_exists=false" >> "$GITHUB_OUTPUT"
                  fi

                  if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
                    echo "Release tag already exists: v$RELEASE_VERSION"
                    exit 1
                  fi

                  echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
                  echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

            - name: Create release branch and bump version
              if: steps.version.outputs.branch_exists != 'true'
              env:
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
                  RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
              run: |
                  git switch -c "$RELEASE_BRANCH"
                  bun pm pkg set version="$RELEASE_VERSION"
                  git diff --check
                  git diff -- package.json

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json
                  git commit -m "chore: release v$RELEASE_VERSION"
                  git push --set-upstream origin "$RELEASE_BRANCH"

            - name: Open release pull request
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
                  RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
              run: |
                  EXISTING_PR=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number')
                  if [ -n "$EXISTING_PR" ]; then
                    echo "Release pull request already exists: #$EXISTING_PR"
                    exit 0
                  fi

                  gh pr create \
                    --base main \
                    --head "$RELEASE_BRANCH" \
                    --title "chore: release v$RELEASE_VERSION" \
                    --body "This PR prepares release v$RELEASE_VERSION. Merge it to build and publish the official installers, create the tag, and update the AUR package when AUR publishing secrets are configured."
