<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'"
        />
        <title>Word2Card</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="bg-mascot"></div>
        <header>
            <div class="window-controls">
                <button class="btn" id="tab-settings-btn" title="Settings">
                    <span class="settings-icon" aria-hidden="true"
                        ><svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                            /></svg
                    ></span>
                </button>
                <button class="btn" id="minimize-btn" title="Minimize">
                    <span class="minus-icon" aria-hidden="true"
                        ><svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        >
                            <path d="M5 12h14" /></svg
                    ></span>
                </button>
                <button class="btn" id="close-btn" title="Close">
                    <span class="mark-icon" aria-hidden="true"
                        ><svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        >
                            <path d="M18 6 6 18M6 6l12 12" /></svg
                    ></span>
                </button>
            </div>
        </header>
        <main>
            <div class="app-title">Word2Card</div>
            <nav>
                <button id="tab-import-btn" class="active-btn">File Import</button>
                <button id="tab-notion-btn">Notion Sync</button>
            </nav>
            <section class="active-section" id="section-import">
                <form id="form-import">
                    <div class="form-group">
                        <input
                            type="text"
                            id="source-file"
                            name="sourceFile"
                            placeholder="Choose input file..."
                        />
                    </div>
                    <br />

                    <div class="form-group">
                        <input
                            type="text"
                            id="deck"
                            name="deck"
                            placeholder="Deck Name (e.g., Vocabulary::Imported)"
                        />
                    </div>
                    <br />

                    <div class="options-group">
                        <div class="flashcard-option">
                            <input type="checkbox" id="chk-flashcard-import" name="isFlashcard" />
                            <label for="chk-flashcard-import">Flashcard</label>
                        </div>
                        <div class="quiz-option">
                            <input type="checkbox" id="chk-quiz-import" name="isQuiz" />
                            <label for="chk-quiz-import">Quiz</label>
                        </div>
                    </div>
                    <br />
                    <button class="submit-btn" type="submit" id="btn-action-import">Submit</button>
                </form>
            </section>

            <section id="section-notion">
                <form id="form-notion">
                    <div class="form-group">
                        <input
                            id="notion-token"
                            name="notionToken"
                            placeholder="Integration Token (e.g., ntn_xxxxx)"
                        />
                    </div>
                    <br />

                    <div class="form-group">
                        <input
                            id="notion-database-id"
                            name="notionDatabaseId"
                            placeholder="Database ID (e.g., xxxxxxxx...)"
                        />
                    </div>
                    <br />
                    <div class="form-group">
                        <input
                            type="text"
                            id="deck"
                            name="deck"
                            placeholder="Deck suffix (optional, e.g., IELTS)"
                        />
                    </div>
                    <br />

                    <div class="options-group">
                        <div class="quiz-option">
                            <input type="checkbox" id="chk-flashcard-notion" name="isFlashcard" />
                            <label for="chk-flashcard-notion">Flashcard</label>
                        </div>
                        <div class="flashcard-option">
                            <input type="checkbox" id="chk-quiz-notion" name="isQuiz" />
                            <label for="chk-quiz-notion">Quiz</label>
                        </div>
                    </div>
                    <br />
                    <button class="submit-btn" type="submit" id="btn-action-sync">Sync</button>
                </form>
            </section>

            <section id="section-settings">
                <form id="form-settings">
                    <div class="form-group">
                        <input
                            type="password"
                            id="openai-key-global"
                            name="openaiKeyGlobal"
                            placeholder="OpenAI API Key (e.g., sk-...)"
                        />
                        <span id="openai-key-status" class="settings-status"></span>
                    </div>
                    <br />

                    <div class="form-group">
                        <input
                            type="password"
                            id="azure-key-global"
                            name="azureKeyGlobal"
                            placeholder="Azure Speech Key"
                        />
                        <span id="azure-key-status" class="settings-status"></span>
                    </div>
                    <br />

                    <div class="form-group">
                        <input
                            type="password"
                            id="pexels-token-global"
                            name="pexelsTokenGlobal"
                            placeholder="Pexels API Key"
                        />
                        <span id="pexels-token-status" class="settings-status"></span>
                    </div>
                    <br />
                    <button class="submit-btn" type="button" id="btn-save-settings">
                        Save Keys
                    </button>
                </form>
            </section>
        </main>
        <script type="module" src="./src/renderer.ts"></script>
    </body>
</html>
